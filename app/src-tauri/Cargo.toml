[package]
name = "cruncha-app"
description = "Cruncha desktop app: Tauri shell around cruncha-store (ADR-0008)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cruncha_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cruncha-store = { path = "../../crates/cruncha-store" }
cruncha-eval = { path = "../../crates/cruncha-eval" }
cruncha-lang = { path = "../../crates/cruncha-lang" }
cruncha-units = { path = "../../crates/cruncha-units" }
cruncha-prose = { path = "../../crates/cruncha-prose" }
cruncha-templates = { path = "../../crates/cruncha-templates" }
cruncha-graph = { path = "../../crates/cruncha-graph" }
cruncha-kernel-py = { path = "../../crates/cruncha-kernel-py" }
cruncha-kernel-rs = { path = "../../crates/cruncha-kernel-rs" }
cruncha-report = { path = "../../crates/cruncha-report" }
cruncha-mcp = { path = "../../crates/cruncha-mcp" }
ulid = "3"
keyring = "4.2"
cruncha-acp = { path = "../../crates/cruncha-acp" }
cruncha-agent = { path = "../../crates/cruncha-agent" }
futures = "0.3"
sha2 = "0.10"
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
