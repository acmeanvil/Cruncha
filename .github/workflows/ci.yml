# SPDX-License-Identifier: GPL-3.0-or-later
# CI (ADR-0001, ADR-0012): licenses of every dependency, Rust (clippy + tests), the front end,
# and the Python worker against the locked packages.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-npm-licenses.mjs

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri and the keychain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Front end (the app crate embeds app/dist)
        working-directory: app
        run: npm ci && npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Python- and Rust-cell tests skip here: their environments live in the macOS app data.
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The locked environment
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv --require-hashes -r python/requirements.lock
      - run: .venv/bin/python -I python/tools/check_licenses.py python/requirements.lock
      - run: .venv/bin/python python/tests/test_worker.py
