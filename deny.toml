# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-deny policy (ADR-0001): every dependency's license must be GPL-3 compatible.
#   cargo deny check licenses bans sources
# Never allow GPL-2.0-only, proprietary, or non-commercial/source-available licenses.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
  "GPL-3.0-or-later", "GPL-3.0-only", "GPL-2.0-or-later",
  "LGPL-2.1-or-later", "LGPL-3.0-or-later", "LGPL-3.0-only", "LGPL-2.1-only",
  "MPL-2.0",
  "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD", "Zlib", "BSL-1.0", "Unlicense", "CC0-1.0",
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0", "Unicode-DFS-2016",
  # libbz2-rs-sys: the BSD-style bzip2 license (GPL-compatible per the FSF).
  "bzip2-1.0.6",
  # webpki-root-certs: Mozilla's CA certificates as data under a permissive data license.
  "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
