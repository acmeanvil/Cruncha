[package]
name = "cruncha-report"
description = "Cruncha's report engine: an evaluated document to Typst, then PDF"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst-render = "0.15.1"

[dev-dependencies]
cruncha-eval = { path = "../cruncha-eval" }
cruncha-lang = { path = "../cruncha-lang" }
