[package]
name = "cruncha-store"
description = "Versioned, always-committed Delta Lake document container for Cruncha"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
deltalake = { version = "1.1.2", default-features = false, features = ["datafusion", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
ulid = "3"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "store_bench"
