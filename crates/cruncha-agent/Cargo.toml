[package]
name = "cruncha-agent"
description = "Cruncha's built-in ACP agent: model providers, Cruncha's MCP tools, skills (ported from looking_glass's lg-agent, MIT)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cruncha-agent"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "5.3.0", features = ["stdio"] }
async-io = "2.6.0"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
cruncha-acp = { path = "../cruncha-acp" }
cruncha-mcp = { path = "../cruncha-mcp" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
