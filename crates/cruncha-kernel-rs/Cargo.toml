[package]
name = "cruncha-kernel-rs"
description = "Rust cells as WASM components in wasmtime (ADR-0006; spike S5)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wasmtime = { version = "51", default-features = false, features = ["component-model", "cranelift", "runtime", "cache", "std", "parallel-compilation"] }
wasmtime-wasi = "51"
syn = { version = "2", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["process", "sync", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
