[package]
name = "cruncha-acp"
description = "Agent Client Protocol client for Cruncha's agent panel (ported from looking_glass's lg-acp, MIT)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-client-protocol = { version = "5.3.0", features = ["process", "stdio"] }
futures = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
